name: Third-party licenses

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'tools/gen_third_party_licenses.py'
      - '.github/workflows/third-party-licenses.yml'
  schedule:
    # Catches transitive/patch-version drift that a pyproject.toml diff
    # alone wouldn't trigger. The commit step below is a no-op, so this
    # produces no noise on weeks where nothing actually changed.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          # No pip cache here, deliberately: this workflow exists to report
          # the newest versions actually satisfying pyproject.toml's
          # constraints, and a restored cache can serve an older wheel that
          # was newest at cache-save time instead.
          cache: ''

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          pip install -e ".[all]"

      - name: Regenerate THIRD-PARTY-LICENSES.md
        run: python tools/gen_third_party_licenses.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- THIRD-PARTY-LICENSES.md; then
            echo "no change; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD-PARTY-LICENSES.md
          git commit -m "chore: regenerate THIRD-PARTY-LICENSES.md"
          git push
