[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI is unverified as available; if "attest" is taken,
# the fallback distribution name is "attest-screening". The import package
# name stays "attest" either way.
name = "attest"
version = "0.1.0"
description = "Screening-and-self-validation kernel for LLM-ensemble evidence screening."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.scripts]
attest = "attest.cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
google = ["google-generativeai>=0.8"]
all = ["anthropic>=0.40", "openai>=1.50", "google-generativeai>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
