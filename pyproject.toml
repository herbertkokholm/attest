[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI is unverified as available; if "attest" is taken,
# the fallback distribution name is "attest-screening". The import package
# name stays "attest" either way.
name = "attest"
version = "0.4.0"
description = "Screening-and-self-validation kernel for LLM-ensemble evidence screening."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["krippendorff>=0.8.2", "scipy>=1.17.1"]

[project.scripts]
attest = "attest.cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-cov"]
anthropic = ["anthropic>=1.1.0"]
openai = ["openai>=2.53.0"]
google = ["google-genai>=1.0.0"]
mistral = ["mistralai>=2.9.3"]
fireworks = ["fireworks-ai>=1.2.9"]
together = ["together>=2.31.0"]
all = [
    "anthropic>=1.1.0",
    "openai>=2.53.0",
    "google-genai>=1.0.0",
    "mistralai>=2.9.3",
    "fireworks-ai>=1.2.9",
    "together>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "google.*", "mistralai.*", "fireworks.*", "together.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["krippendorff.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.coverage.run]
source = ["attest"]

[tool.coverage.report]
skip_covered = false
show_missing = true
