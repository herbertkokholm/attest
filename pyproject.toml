[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI is unverified as available; if "attest" is taken,
# the fallback distribution name is "attest-screening". The import package
# name stays "attest" either way.
name = "attest"
version = "0.4.0"
description = "Screening-and-self-validation kernel for LLM-ensemble evidence screening."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["krippendorff>=0.8.2", "scipy>=1.11"]

[project.scripts]
attest = "attest.cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]
anthropic = ["anthropic>=0.120.2"]
openai = ["openai>=1.50"]
google = ["google-generativeai>=0.8"]
mistral = ["mistralai>=1.0"]
all = ["anthropic>=0.120.2", "openai>=1.50", "google-generativeai>=0.8", "mistralai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "google.*", "mistralai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["krippendorff.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
